<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - LetsBlog</title>
  <meta name="theme-color" content="#FFCC00">
  <link rel="stylesheet" href="/blog-app/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <script src="/blog-app/js/script.js" defer></script>
</head>
<body>
  <header>
    <div class="container header-inner">
      <div class="brand">
        <h1>LetsBlog</h1>
      </div>

      <nav class="nav-links">
        <a href="/blog-app/index.php">Home</a>
        <a href="/blog-app/login.html">Login</a>
      </nav>
    </div>
  </header>

  <div class="auth-shell">
    <div class="auth-card">
      <h2>Create an account</h2>
      <form action="php/register.php" method="POST" enctype="multipart/form-data">
        <div class="form-row">
          <label for="name">Name</label>
          <input id="name" type="text" name="name" placeholder="Enter your full name" required>
        </div>
        <div class="form-row">
          <label for="email">Email</label>
          <input id="email" type="email" name="email" placeholder="you@example.com" required>
        </div>
        <div class="form-row">
          <label for="password">Password</label>
          <input id="password" type="password" name="password" placeholder="Create a password" required>
        </div>
        <div class="form-row">
          <label for="profile_image">Profile picture</label>
          <input id="profile_image" type="file" name="profile_image" accept="image/*">
        </div>
        <button type="submit">Register</button>
      </form>
      <p class="small">Already have an account? <a href="/blog-app/login.html">Login</a></p>
    </div>
  </div>

</body>
</html>
